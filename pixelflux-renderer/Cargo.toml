[package]
name = "pixelflux-renderer"
version = "2.0.0-waydesk.1"
edition = "2021"
license = "MPL-2.0"
publish = false

[dependencies]
gbm = "0.18"
thiserror = "2.0"

[dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "ca932e042fa9ad150605c150a86275b85f9ad5b3"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
]
